<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追乡者联合体服务器官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0e17;
            color: white;
            font-family: "Microsoft YaHei", sans-serif;
            padding-top: 80px;
            min-height: 100vh;
            /* 淡淡的径向渐变光，让深色背景不单调 */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 250, 0.06), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(108, 99, 255, 0.06), transparent 40%);
            background-attachment: fixed;
        }

        /* ================= 导航栏核心样式 ================= */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(20, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        /* 左侧 Logo */
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00FFFA;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 250, 0.3);
            cursor: default;
            transition: 0.3s ease;
        }

        .logo:hover {
            text-shadow: 0 0 30px rgba(0, 255, 250, 0.6);
        }

        /* 右侧菜单 */
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-menu li a {
            text-decoration: none;
            color: #a7a9be;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
            transition: 0.3s ease;
            position: relative;
        }

        /* 悬停效果：变亮 + 底部出现亮线 */
        .nav-menu li a:hover {
            color: #00FFFA;
            border-bottom-color: #00FFFA;
            text-shadow: 0 0 15px rgba(0, 255, 250, 0.4);
        }

        /* 当前激活的菜单项 */
        .nav-menu li a.active {
            color: #00FFFA;
            border-bottom-color: #00FFFA;
        }

        /* ================= 首页主内容 ================= */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
            text-align: center;
        }

        /* 主卡片 */
        .hero-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 60px 70px;
            max-width: 720px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 40px rgba(0, 255, 250, 0.03);
            animation: fadeInUp 0.8s ease both;
        }

        .hero h1 {
            font-size: 38px;
            color: #fffffe;
            letter-spacing: 3px;
            margin-bottom: 36px;
            line-height: 1.4;
            text-shadow: 0 0 30px rgba(0, 255, 250, 0.15);
        }

        /* 信息行 */
        .info-item {
            margin: 18px 0;
            font-size: 17px;
            color: #a7a9be;
            letter-spacing: 1px;
        }

        /* 服务器地址的代码块样式 */
        .info-item code {
            display: inline-block;
            background: rgba(0, 0, 0, 0.4);
            color: #00FFFA;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 255, 250, 0.25);
            box-shadow: 0 0 20px rgba(0, 255, 250, 0.15);
            margin-left: 8px;
            transition: 0.3s ease;
            cursor: pointer;
            user-select: all;
        }

        .info-item code:hover {
            background: rgba(0, 255, 250, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 250, 0.4);
            transform: scale(1.03);
        }

        /* 版本徽章 */
        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6C63FF, #00FFFA);
            color: #0f0e17;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 2px;
            margin-left: 8px;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        /* ================= 动画 ================= */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= 移动端适配 ================= */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 20px;
                height: 60px;
            }
            .logo {
                font-size: 20px;
            }
            .nav-menu {
                gap: 15px;
            }
            .nav-menu li a {
                font-size: 14px;
            }

            body {
                padding-top: 70px;
            }

            .hero {
                min-height: calc(100vh - 70px);
            }

            .hero-card {
                padding: 40px 24px;
                border-radius: 20px;
            }

            .hero h1 {
                font-size: 24px;
                letter-spacing: 2px;
                margin-bottom: 26px;
            }

            .info-item {
                font-size: 15px;
            }

            .info-item code {
                display: block;
                margin: 10px auto 0;
                font-size: 16px;
                width: fit-content;
            }

            .version-badge {
                margin-top: 6px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>

    <!-- ================= 导航栏结构 ================= -->
    <nav class="navbar">
        <div class="logo">追乡者联合体</div>
        <ul class="nav-menu">
            <li><a href="index.html" class="active">首页</a></li>
            <li><a href="mcsrvstat.html">状态查询</a></li>
        </ul>
    </nav>

    <!-- ================= 首页内容 ================= -->
    <section class="hero">
        <div class="hero-card">
            <h1>欢迎来到追乡者联合体官方网站</h1>
            <p class="info-item">服务器地址：<code>mc.homecc.zh.kg</code></p>
            <p class="info-item">版本：<span class="version-badge">26.3</span></p>
        </div>
    </section>

</body>
</html>
